# =====================================================================
# 采集清单 · _default 兜底版（脱敏骨架）
# ---------------------------------------------------------------------
# 用途：把"每月要采什么"固化下来，避免按记忆漏采/错采。
# 字段说明：
#   id: 唯一标识（如 IPO/科创板/在审数）
#   章节: 对应月报中的章节
#   类型: 时点型（按月重采）/ 半结构型（核变化）/ 结构型（直接复制）
#   通道: 采集通道名（必须出现在 口径字典.yaml 的 采集通道 中）
#   枚举: 必须全量枚举（用于计数断言）
#   输出: 输出字段列表（key 为表格列名）
#   来源: 期望的源文件类型（CSV/PDF/HTML）
# 公开版：示例项为通用模板，用户可删改；具体行业由 wizard 反推。
# =====================================================================

版本: "1.0"

采集项:
  # 示例：上市审核项目（用户按需启用/修改）
  - id: "IPO/科创板/在审"
    章节: "资本市场动态"
    类型: "时点型"
    通道: "上交所科创板IPO"
    枚举: true
    输出: ["公司简称", "审核状态", "保荐机构", "更新日期"]
    来源: "CSV"

  - id: "IPO/创业板/在审"
    章节: "资本市场动态"
    类型: "时点型"
    通道: "深交所IPO"
    枚举: true
    输出: ["公司简称", "审核状态", "保荐机构", "更新日期"]
    来源: "CSV"

  - id: "IPO/北交所/在审"
    章节: "资本市场动态"
    类型: "时点型"
    通道: "北交所IPO"
    枚举: true
    输出: ["公司简称", "审核状态", "保荐机构", "更新日期"]
    来源: "CSV"

  - id: "辅导备案/全量"
    章节: "资本市场动态"
    类型: "时点型"
    通道: "证监会辅导备案"
    枚举: true
    输出: ["公司全称", "注册地", "辅导机构", "辅导状态"]
    来源: "CSV"

  - id: "再融资/全量"
    章节: "资本市场动态"
    类型: "时点型"
    通道: "上交所再融资"
    枚举: true
    输出: ["公司简称", "再融资类型", "审核状态", "更新日期"]
    来源: "CSV"

  - id: "并购重组/全量"
    章节: "资本市场动态"
    类型: "时点型"
    通道: "上交所并购重组"
    枚举: true
    输出: ["公司简称", "交易类型", "审核状态", "更新日期"]
    来源: "CSV"

# 用户可在此继续添加：
#   - 行业动态（按月重采的官方发布/权威媒体）
#   - 一级市场融资（IT 桔子/烯牛等，按月重采）
#   - 公司公告（巨潮资讯，按公司筛选）
#   - 财务数据（按公司按财报期）

# 通道名必须出现在 口径字典.yaml 的 采集通道 中（config_check.py 校验）