# =====================================================================
# 时点对齐策略 · _default 兜底版（脱敏骨架）
# ---------------------------------------------------------------------
# 用途：把"各源数据时点 → 目标时点（YYYY-MM）"的对齐规则固化下来。
# 月报目标时点：每月最后一个交易日 23:59:59（默认）。
# 各源的实际时点：交易所 T+1 盘后更新、证监会 T+1 更新、媒体 T+0 实时。
# =====================================================================

版本: "1.0"

# 目标时点（每月最后一个交易日 23:59:59）
目标时点:
  规则: "本月最后一个交易日 23:59:59（默认）"
  特殊处理: "若旧月报锚定其他时点（如月初/月中），按用户 Step 4 确认"

# 各源数据时点 → 目标时点
时点映射:
  上交所/深交所/北交所:
    数据时点: "T+1 盘后（约 18:00 后）"
    对齐方式: "本月最后一个交易日后次日盘后取数"
  证监会辅导备案:
    数据时点: "T+1"
    对齐方式: "本月最后一日 + 1 取数"
  港交所披露易:
    数据时点: "T+0 实时"
    对齐方式: "本月最后一日 23:59:59 前所有公告"
  美股SEC:
    数据时点: "T+0 实时"
    对齐方式: "本月最后一日 23:59:59 ET 前所有 filing"
  巨潮资讯:
    数据时点: "T+0 实时"
    对齐方式: "本月最后一日 23:59:59 前所有公告"
  行情数据(iFinD/Wind/akshare):
    数据时点: "T+0 收盘"
    对齐方式: "本月最后一个交易日收盘价"
  一级市场融资(IT 桔子/烯牛):
    数据时点: "T+0 录入"
    对齐方式: "公告披露日为准"

# 时点冲突处理
冲突处理:
  优先级: "公告披露日 > 官网更新日 > 媒体转载日"
  标注: "正文中需明确口径来源（如『截至 2026-08-31 收盘』）"
  跨源差异: "若同一字段多源时点不一致，按优先级取高优先级源，并在溯源.jsonl 记录"

# 首页脚注规范
首页脚注:
  格式: "按口径字典 vX.Y、采集清单 vX.Y（采集日 / 目标时点 YYYY-MM-DD）"
  示例: "按口径字典 v1.0、采集清单 v1.0（采集日 2026-09-01 / 目标时点 2026-08-31）"