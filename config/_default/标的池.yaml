# =====================================================================
# 标的池 · _default 兜底版（脱敏骨架）
# ---------------------------------------------------------------------
# 用途：把"赛道白名单"固化下来，避免按记忆漏标。
# 公开版：_default 兜底包不含具体标的池（仅占位）。
# 用户激活后由 `python scripts/pack.py wizard 旧月报.docx --name <行业>` 反推生成。
# 反推结果为候选召回骨架，标的需逐家人工判断是否属于赛道后才能启用。
# =====================================================================

版本: "1.0"

# _default 兜底包：标的池为空，由具体行业包补完
赛道白名单:
  说明: "_default 兜底包不含具体标的池；用户应通过 wizard 反推具体行业包"

子板块:
  说明: "_default 兜底包不含子板块划分；用户应通过 wizard 反推"

# =====================================================================
# 反推新行业标的池的步骤：
# 1. 运行 `python scripts/pack.py wizard 旧月报.docx --name <新行业>`
#    → 生成 packs/<新行业>/标的池.yaml 候选召回骨架（含 TODO 标记）
# 2. 人工逐家判断是否属于赛道
#    - 属于 → 加入 赛道白名单
#    - 不属于 → 删除
#    - 待定 → 加入 子板块 下的 待定 区（每月复审）
# 3. 运行 `python scripts/pack.py activate <新行业>`
#    → 自动备份旧 config/ 到 config/_backup/
# 4. 运行 `python scripts/snapshot.py snapshot --ym <YYYY-MM> --run-id <run-id>`
#    → 落盘新口径快照
# =====================================================================