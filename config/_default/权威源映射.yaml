# =====================================================================
# 权威源映射 · _default 兜底版（脱敏骨架）
# ---------------------------------------------------------------------
# 用途：交叉验证冲突消解时，先查本表找到该字段的权威源，再落到次一级源。
# 原则：权威性是「字段维度」的，不是固定排序。例如：
#   - 法定代表人 以工商注册为准（企查查可能比 iFinD 更权威）
#   - 融资金额 以公司公告/招股书为准（IT 桔子/媒体只是二手）
#   - 行情 以交易所为准
# 冲突时记录「冲突内容 + 采用源 + 理由」，写进溯源.jsonl。
# =====================================================================

版本: "1.0"

权威源映射:
  法定代表人:    [qcc工商, 上市公司年报]
  实控人:        [qcc实际控制人, 上市公司年报]
  股东:          [qcc股东, 上市公司定期报告]
  董监高:        [qcc高管, 上市公司年报]
  融资金额:      [公司公告/招股书, IT桔子, 媒体]
  估值:          [公司公告/招股书, IT桔子, 媒体]
  财务数据:      [上市公司财报, iFinD, Wind, qcc财务]
  行情:          [交易所, iFinD, Wind]
  IPO在审:       [交易所审核官网]
  辅导备案:      [证监会官网]
  并购重组:      [交易所审核官网, 公司公告]
  专利:          [国家知识产权局, qcc专利]
  商标:          [国家知识产权局商标局, qcc商标]
  行政处罚:      [监管公示, qcc风险]
  涉诉:          [裁判文书网, qcc司法]
  政策:          [官方发布, dknowc可信搜索, 媒体]
  行业动态:      [官方发布, 权威媒体, 财经媒体]

# 通用降级顺序（当字段无专门映射时使用）
通用降级:
  - 官方一手源（交易所/证监会/公司公告/招股书）
  - 权威金融数据（iFinD/Wind）
  - 专业数据（企查查工商/IT桔子）
  - 媒体报道/新闻

# 冲突处理规则
冲突处理:
  规则: "按字段权威源映射取高优先级源"
  记录: "冲突内容 + 采用源 + 理由 写入 溯源.jsonl 的 conflict 字段"
  兜底: "官方源拿不到时，用次一级源并标注『未能与官方源交叉验证』"

# =====================================================================
# 降级链 —— 每个字段的「首选 → 兜底 → 无法获取」三级路径
# ---------------------------------------------------------------------
# 用途：Step 2 映射表「降级链」列的权威依据；执行时以实时 tools/list 为准。
# 关键：首选源失败时，立即沿降级链切到兜底，不要停在原地硬扛。
# =====================================================================
降级链:
  IPO在审:        "交易所审核官网 → mx-ds-mcp / iFinD(hexin-ifind-ds) → 标注无法获取"
  辅导备案:       "证监会官网(eid.csrc.gov.cn, http) → iFinD辅导备案 → 标注无法获取"
  港股发行/在审:  "披露易 / mcp-hkexnews → mx_hk_finance_data / iFinD → 推算+标注不确定性"
  再融资/并购:    "交易所审核官网 → mx-ds-mcp / iFinD → 标注无法获取"
  一级市场融资:   "IT桔子(itjuzi search_events) → 财经媒体检索 / mx_finance_search_news → 标注无法获取"
  法定代表人:     "qcc get_company_registration_info → 巨潮(cninfo) / 招股书 → 标注无法获取"
  财务数据:       "上市公司财报 / iFinD / Wind → mx_ashare_finance_data / qcc财务 → 源文件标财报期"
  政策:           "dknowc可信搜索 / 官方发布 → mx_finance_search_news / web_search → 标注无法获取"
  行业动态:       "权威媒体 / mx_finance_search_news → web_search → 标注无法获取"
  行情/估值:      "交易所 / Wind → stock-sdk / akshare / tushare → 标注无法获取"